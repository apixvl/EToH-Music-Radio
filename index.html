<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>EToH Radio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="radio-dropdown">
  <button class="dropbtn" id="menuBtn">Change Radio <span id="arrow">▾</span></button>
  <div class="dropdown-content" id="menuContent"></div>
</div>

  <div id="radio">
    <h1>Now Playing</h1>
    <p id="currentTrack">Loading... (If it is still loading after 1 minute, refresh tab)</p>
    <p id="timeLeft"></p>
    <audio id="audio" controls autoplay></audio>
  </div>

<script src="stations.js"></script>
  
  <script src="script.js"></script>

  <script>
    // Define everything ONCE
    const menuBtn = document.getElementById('menuBtn');
    const menuContent = document.getElementById('menuContent');
    const arrow = document.getElementById('arrow');

    // Function to build the radio list
    function populateRadios() {
        if (!window.allStations) {
            console.error("stations.js is missing or empty!");
            return;
        }

        menuContent.innerHTML = ''; 

        allStations.forEach(station => {
            const link = document.createElement('a');
            link.href = station.url;
            link.textContent = station.name;
            
            // Check if this is the current page
            if (window.location.pathname.includes(station.url)) {
                link.style.color = "#00ffcc";
                link.textContent += " (Live)";
            }

            menuContent.appendChild(link);
        });
    }

    // Toggle logic
    menuBtn.addEventListener('click', (e) => {
        e.stopPropagation(); 
        menuContent.classList.toggle('show');
        arrow.classList.toggle('arrow-rotate');
    });

    // Close on outside click
    window.addEventListener('click', () => {
        menuContent.classList.remove('show');
        arrow.classList.remove('arrow-rotate');
    });

    // Run the population
    populateRadios();
  </script>
</body>
</html>
